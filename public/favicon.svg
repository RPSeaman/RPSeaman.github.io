  <circle cx="16" cy="29" r="2.5" fill="#818cf8"/>
  <!-- Bold clean monogram -->
  <text x="16" y="21.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="-0.5">RS</text>
</svg>
